<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Бронирование рабочих мест</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Бронирование рабочих мест</h1>

    <!-- Форма: сюда пользователь вводит данные новой брони -->
    <form id="task-form" class="card">
      <h2>Новая бронь</h2>

      <label for="task-title">Место</label>
      <input id="task-title" type="text" placeholder="Например, A-12">
      <div class="error" id="error-title"></div>

      <label for="task-priority">Расположение</label>
      <select id="task-priority">
        <option value="floor1" selected>1 этаж</option>
        <option value="floor2">2 этаж</option>
        <option value="floor3">3 этаж</option>
      </select>

      <br><br>
      <button type="submit" class="primary">Забронировать</button>
    </form>

    <h2>Список броней</h2>

    <!-- Элементы управления: список для выбора, поле ввода, кнопка -->
    <div class="toolbar">
      <select id="status-filter">
        <option value="">Все статусы</option>
        <option value="booked">Забронировано</option>
        <option value="free">Свободно</option>
        <option value="cancelled">Отменено</option>
      </select>
      <input id="search-input" type="text" placeholder="Поиск по месту, сотруднику...">
      <button id="refresh-button">Загрузить с сервера</button>
    </div>

    <!-- Область отображения информации: «Загрузка…», «Ничего не найдено», ошибки -->
    <div id="info" class="message">Нажмите «Загрузить с сервера»</div>

    <!-- Таблицу заполняет JavaScript -->
    <table id="task-table" hidden>
      <thead>
        <tr>
          <th>№</th>
          <th>Место</th>
          <th>Сотрудник</th>
          <th>Дата</th>
          <th>Статус</th>
          <th>Расположение</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="task-body"></tbody>
    </table>

    <p>Броней на странице: <strong id="counter">0</strong></p>
  </div>

  <!-- Скрипты подключаются в конце страницы, когда вся разметка уже загружена -->
  <script src="js/mock-data.js"></script>   <!-- данные и таблица запросов учебного сервера -->
  <script src="js/mock-api.js"></script>    <!-- «движок» учебного сервера (не менять) -->
  <script src="js/app.js"></script>
</body>
</html>
